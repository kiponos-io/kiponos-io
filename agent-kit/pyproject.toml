[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiponos"
version = "0.2.0"
description = "Kiponos Python SDK + MCP for agent live config (get/set/subscribe)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Kiponos.io", email = "support@kiponos.io" }]
keywords = ["kiponos", "config", "mcp", "agent", "websocket", "realtime"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "websocket-client>=1.8.0,<2.0.0",
  "mcp>=1.0.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kiponos-mcp = "kiponos_mcp.server:main"
kiponos-cli = "kiponos.cli:main"

[project.urls]
Homepage = "https://kiponos.io"
Repository = "https://github.com/kiponos-io/kiponos-io"
Documentation = "https://github.com/kiponos-io/kiponos-io/tree/main/agent-kit"
Issues = "https://github.com/kiponos-io/kiponos-io/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kiponos*", "kiponos_mcp*"]
